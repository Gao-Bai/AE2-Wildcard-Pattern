plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.53'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // AE2 for 1.20.1. When the Gradle cache/ModMaven has it, use the normal coordinates:
    //   implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    // Otherwise the jar dropped into ./libs is used (this is what the offline build does - AE2 is
    // only needed at compile time, since it ships its API at runtime).
    if (file("libs/appliedenergistics2-forge-${ae2_version}.jar").exists()) {
        compileOnly files("libs/appliedenergistics2-forge-${ae2_version}.jar")
    } else {
        implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    }

    // JEI: optional dependency, only used for the "drag an ingredient from JEI into the rule list"
    // shortcut. Same libs/ drop-in rule as AE2. In a normal (online) environment add the JEI maven
    // repository and use:  compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    var jeiJar = file("libs/jei-${minecraft_version}-forge-${jei_version}.jar")
    if (jeiJar.exists()) {
        compileOnly files(jeiJar)
    } else if (!fileTree(dir: 'libs', include: 'jei-*.jar').isEmpty()) {
        compileOnly fileTree(dir: 'libs', include: 'jei-*.jar')
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
