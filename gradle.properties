# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Environment (Minecraft 1.20.1 / Forge)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.20
forge_version_range=[47,)
loader_version_range=[47,)

# Mappings (official mojang mappings, MDG 6.0.16+)
mapping_channel=official
mapping_version=1.20.1

# Mod
mod_id=wildcardencoder
mod_name=AE2 Wildcard Pattern Encoder
mod_license=MIT
mod_version=2.3.1
mod_group_id=com.ae2wildcard
mod_authors=DeepSeek Harness
mod_description=One-click wildcard pattern encoding for Applied Energistics 2. Templates such as "ingot* -> plate*" are expanded into concrete processing patterns using Forge item tags (the 1.20.1 replacement for the ore dictionary).

# Applied Energistics 2 (1.20.1 / Forge).
# Known good releases on https://modmaven.dev/appeng/appliedenergistics2-forge/ :
#   15.0.23 / 15.1.1 / 15.2.16 / 15.3.6 / 15.4.11
# Pick the one matching the AE2 version you actually run, then run:
#   gradlew --refresh-dependencies
ae2_version=15.4.10

# JEI: optional dependency, used only for the "drag an item from JEI into the rule list" feature.
# Same drop-in rule as AE2 above: put jei-1.20.1-forge-<version>.jar into libs/.
jei_version=15.20.0.129
